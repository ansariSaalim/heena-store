<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5A3D">
<title>Heena Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind:wght@500&display=swap">
<style>
/* Layout: mobile-app shell (Dribbble-style ecommerce). Sticky app bar, soft rounded product cards on pastel tiles with canvas-drawn bowls, floating tab bar, sticky action bar on product, cart, checkout and pay views. */
:root{
  --bg:#F3F4EF; --surface:#FFFFFF; --ink:#16211B; --muted:#69736C; --line:#E2E6DD;
  --primary:#1F5A3D; --on-primary:#FFFFFF; --primary-soft:#E1EDE5;
  --accent:#F2B33D; --on-accent:#2A1E05; --chili:#C2412A; --chili-soft:#FBE6E1;
  --t-peach:#FBE2D2; --t-butter:#FAEFC8; --t-sage:#DFEBDB; --t-sand:#F0E5D4; --t-blush:#F7DDD8; --t-mist:#E1E8EC;
  --tab-on:rgba(255,255,255,.14); --paper:#FFFFFF;
  --shadow:0 1px 2px rgba(22,33,27,.05),0 10px 26px rgba(22,33,27,.07);
  --body:'Plus Jakarta Sans','Hind',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1310; --surface:#171E1A; --ink:#EDF2EB; --muted:#9AA59D; --line:#26312B;
    --primary:#62C28D; --on-primary:#0C140F; --primary-soft:#1A3326;
    --accent:#F2B33D; --on-accent:#2A1E05; --chili:#F07A60; --chili-soft:#3A2220;
    --t-peach:#33261F; --t-butter:#302B1B; --t-sage:#1E2C22; --t-sand:#2D271F; --t-blush:#33221F; --t-mist:#1E262B;
    --tab-on:rgba(0,0,0,.12); --paper:#FFFFFF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1310; --surface:#171E1A; --ink:#EDF2EB; --muted:#9AA59D; --line:#26312B;
  --primary:#62C28D; --on-primary:#0C140F; --primary-soft:#1A3326;
  --accent:#F2B33D; --on-accent:#2A1E05; --chili:#F07A60; --chili-soft:#3A2220;
  --t-peach:#33261F; --t-butter:#302B1B; --t-sage:#1E2C22; --t-sand:#2D271F; --t-blush:#33221F; --t-mist:#1E262B;
  --tab-on:rgba(0,0,0,.12); --paper:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-bottom:30px}
body.pad main.wrap{padding-bottom:120px}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.appbar .wrap{display:flex;align-items:center;gap:12px;min-height:64px;padding-block:10px}
.iconbtn{position:relative;width:44px;height:44px;border-radius:15px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none;text-decoration:none}
.bartitle{flex:1;text-align:center;font-weight:700;font-size:17px;margin:0}
.spacer{width:44px;flex:none}
.loc{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.loc .pinic{width:44px;height:44px;border-radius:15px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.loc small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.loc b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}

/* home */
.hello{padding-top:6px}
.greet{margin:0;color:var(--muted);font-weight:600;font-size:14px}
.hello h1{margin:2px 0 0;font-size:clamp(26px,6.5vw,38px);line-height:1.12;font-weight:800;letter-spacing:-.02em;max-width:16ch}
.searchrow{display:flex;gap:10px;margin-top:16px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px;color:var(--muted)}
.search:focus-within{border-color:var(--primary)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:12px 0;outline:0}
.sortbtn{background:var(--primary);color:var(--on-primary);border-color:transparent}
.sorts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:12px;padding-bottom:2px}
.sorts::-webkit-scrollbar,.cats::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:13.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.banner{margin-top:18px;background:var(--primary);color:var(--on-primary);border-radius:26px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);overflow:hidden;min-height:160px}
.btext{padding:20px 0 20px 20px;display:grid;gap:6px;align-content:center}
.bkick{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.8}
.banner h2{margin:0;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.banner p{margin:0;font-size:13px;opacity:.85}
.bbtn{justify-self:start;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;text-decoration:none;margin-top:6px}
.bimg{position:relative;min-height:150px}
.bimg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.cats{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-top:20px;padding-bottom:4px}
.cat{display:grid;justify-items:center;gap:6px;background:none;border:0;padding:0;flex:none;width:70px}
.cat .ci{width:64px;height:64px;border-radius:22px;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden;color:var(--muted)}
.cat .ci canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cat[aria-pressed="true"] .ci{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.cat span{font-size:12.5px;font-weight:600;line-height:1.2;text-align:center}
.cat[aria-pressed="true"] span{color:var(--primary)}

.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:24px 0 12px}
.sec h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.sec span{font-size:13px;color:var(--muted);font-weight:600}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(164px,186px);gap:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px}
@media (min-width:720px){.pgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}}

/* product card */
.pcard{position:relative;background:var(--surface);border-radius:24px;padding:8px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0;scroll-snap-align:start}
.pimg{display:block;border-radius:18px;background:var(--tint);aspect-ratio:1/.86;position:relative;max-width:100%}
.pimg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fav{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow)}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{color:var(--chili)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.ptag{position:absolute;top:16px;left:16px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:8px}
.pinfo{padding:0 6px 6px;display:grid;gap:1px;flex:1}
.pname{font-weight:700;font-size:14.5px;line-height:1.25;text-decoration:none}
.pmeta{font-size:12.5px;color:var(--muted)}
.star{color:var(--accent)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:8px;min-height:44px}
.pprice b{font-weight:800;font-size:16.5px;display:block;line-height:1.1}
.pprice small{font-size:11px;color:var(--muted)}
.plus{width:38px;height:38px;border-radius:13px;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.mstep{display:inline-flex;align-items:center;background:var(--primary);color:var(--on-primary);border-radius:13px;flex:none}
.mstep button{border:0;background:transparent;color:inherit;width:30px;height:38px;font-size:18px;font-weight:700;line-height:1}
.mstep output{min-width:16px;text-align:center;font-weight:800;font-size:14px}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:26px;display:flex;justify-content:space-between;padding:8px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.tab{position:relative;flex:1;display:grid;justify-items:center;gap:1px;color:inherit;opacity:.62;text-decoration:none;font-size:11px;font-weight:700;padding:7px 4px;border-radius:18px}
.tab[aria-current="page"]{opacity:1;background:var(--tab-on)}
.tab .dot{top:2px;right:calc(50% - 22px)}

/* action bar */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.06);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actionbar .in{max-width:1080px;margin:0 auto;display:flex;gap:12px;align-items:center}
.cta{flex:1;border:0;background:var(--primary);color:var(--on-primary);border-radius:16px;padding:15px 18px;font-weight:800;font-size:15.5px;text-decoration:none;text-align:center}
.cta:disabled{opacity:.6;cursor:progress}
.atotal{display:grid;line-height:1.2}
.atotal small{color:var(--muted);font-size:12px;font-weight:600}
.atotal b{font-size:19px;font-weight:800}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:16px;flex:none}
.qty button{border:0;background:transparent;width:40px;height:48px;font-size:20px;font-weight:700}
.qty output{min-width:22px;text-align:center;font-weight:800}

/* detail */
.detail{display:grid;gap:18px}
@media (min-width:820px){.detail{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:28px}}
.dimg{background:var(--tint);border-radius:30px;aspect-ratio:1/.82;position:relative;max-width:100%}
.dimg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.dinfo{display:grid;gap:16px;min-width:0}
.dinfo h1{margin:0;font-size:clamp(24px,5.5vw,32px);line-height:1.15;font-weight:800;letter-spacing:-.02em}
.hi{margin:4px 0 0;color:var(--muted);font-size:14px}
.rate{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700}
.pill.green{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.desc{margin:0;color:var(--muted);max-width:60ch}
.dinfo h3{margin:0 0 -6px;font-size:15px;font-weight:800}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.size{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;text-align:left;display:grid;gap:1px}
.size b{font-size:15px}
.size span{font-weight:800;font-size:16px}
.size small{font-size:11.5px;color:var(--muted)}
.size[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.facts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.facts3 div{background:var(--surface);border-radius:18px;padding:12px;display:grid;gap:2px;box-shadow:var(--shadow)}
.facts3 b{font-size:16px;font-weight:800}
.facts3 span{font-size:12px;color:var(--muted);line-height:1.3}
.incart{margin:0;font-size:13.5px;color:var(--primary);font-weight:700}

/* cards / cart / checkout */
.stack{display:grid;gap:14px}
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.card h2{margin:0;font-size:16.5px;font-weight:800}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media (min-width:880px){.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}}
.cols>.stack+.stack{margin-top:14px}
@media (min-width:880px){.cols>.stack+.stack{margin-top:0}}
.cline{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border-radius:22px;padding:10px;box-shadow:var(--shadow)}
.cthumb{width:76px;height:76px;border-radius:17px;background:var(--tint);position:relative;display:block}
.cthumb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cname{font-weight:700;font-size:14.5px;line-height:1.25;text-decoration:none;display:block}
.cmeta{font-size:12.5px;color:var(--muted)}
.cright{display:grid;justify-items:end;gap:6px}
.cright b{font-size:15px;font-weight:800}
.freebar{background:var(--surface);border-radius:20px;padding:14px 16px;display:grid;gap:8px;box-shadow:var(--shadow);font-size:13.5px;font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);border-radius:99px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.row span:first-child{color:var(--muted)}
.row.total{font-size:16.5px;font-weight:800;border-top:1px dashed var(--line);padding-top:10px}
.row.total span:first-child{color:var(--ink)}
.free{color:var(--primary);font-weight:700}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface);border-radius:18px;padding:12px 14px;border:1px dashed var(--line)}
.f{display:grid;gap:5px;min-width:0}
.f label{font-size:12.5px;font-weight:700;color:var(--muted)}
.f input,.f textarea{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;border-radius:14px;padding:11px 13px;width:100%;min-width:0}
.f input:focus,.f textarea:focus{outline:0;border-color:var(--primary)}
.f [aria-invalid="true"]{border-color:var(--chili)}
.f textarea{resize:vertical;min-height:66px}
.err{color:var(--chili);font-size:12.5px}
.err:empty{display:none}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slotb{border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:10px 8px;display:grid;gap:1px;text-align:center}
.slotb b{font-size:13.5px}
.slotb span{font-size:12px;color:var(--muted)}
.slotb[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.pm{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:18px;padding:12px 14px}
.pm input{accent-color:var(--primary);width:18px;height:18px;margin:0;flex:none}
.pm div{flex:1;min-width:0;display:grid}
.pm b{font-size:15px}
.pm span{font-size:12.5px;color:var(--muted)}
.pm.on{border-color:var(--primary);background:var(--primary-soft)}
.pm.off{opacity:.8}
.pm.off b{text-decoration:line-through;text-decoration-thickness:1px}
.nope{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--chili);background:var(--chili-soft);padding:3px 8px;border-radius:7px}
.upitag{flex:none;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--on-primary);background:var(--primary);padding:3px 8px;border-radius:7px}
.sline{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.sline span:first-child{min-width:0}
.sline small{color:var(--muted)}

/* pay */
.amtcard{background:var(--primary);color:var(--on-primary);border-radius:24px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.amtcard small{display:block;font-size:12.5px;opacity:.8;font-weight:600}
.amtcard b{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.amtcard .timer{background:var(--tab-on);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700}
.qrwrap{display:grid;justify-items:center;gap:10px;position:relative}
.qrbox{background:var(--paper);padding:12px;border-radius:20px;border:1px solid var(--line);width:210px;height:210px;display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:184px;height:184px}
.qrbox.expired{opacity:.12}
.qrexp{position:absolute;top:78px;left:50%;transform:translateX(-50%);display:grid;gap:8px;justify-items:center;font-weight:800;text-align:center}
.qrexp button{border:0;background:var(--ink);color:var(--bg);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px}
.muted{color:var(--muted);font-size:13px;margin:0}
.vpa{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px;flex-wrap:wrap}
.vpa code{font-size:14.5px;font-weight:600;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700}
.openapp{display:flex;justify-content:center;align-items:center;border-radius:14px;padding:12px;background:var(--ink);color:var(--bg);font-weight:800;text-decoration:none}
.ghost{border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:14px;padding:11px 14px;width:100%;font-size:13.5px;font-weight:700}

/* done + orders */
.okhero{display:grid;justify-items:center;text-align:center;gap:8px;padding:10px 0 6px}
.okring{width:84px;height:84px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center}
.okring span{width:60px;height:60px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.okhero h1{margin:6px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.okhero p{margin:0;color:var(--muted);max-width:40ch}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:700;word-break:break-word}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li::after{content:"";position:absolute;left:10px;top:22px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--on-primary)}
.tl li.done i{background:var(--primary);border-color:var(--primary)}
.tl li.done::after{background:var(--primary)}
.tl b{display:block;font-size:14px}
.tl span{font-size:12.5px;color:var(--muted)}

function items(){

/* ---- canvas: nuts and chana heaped in a bowl ---- */
function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const KIND = {
  peanutRoast:{mix:[['peanut',['#C98A3E','#B9772F','#D9A055','#C0803A']]],s:.15},
  peanutMasala:{mix:[['peanut',['#B9472A','#C65A2F','#A93D22','#CF6A36']]],s:.15,specks:true},
  peanutRaw:{mix:[['peanut',['#9E3A2C','#AE4A39','#8C3125','#B85A45']]],s:.15},
  chanaSkin:{mix:[['chana',['#8B5A2B','#7A4C23','#9A6835','#6E4320']]],s:.12},
  chanaYellow:{mix:[['split',['#E4B648','#D8A83A','#ECC362','#DDAE44']]],s:.12},
  kala:{mix:[['chana',['#4B2E1F','#3D2518','#5B3826','#6A4330']]],s:.1},
  kabuli:{mix:[['kabuli',['#E2C597','#D6B683','#EAD2A8','#DDBE8D']]],s:.14},
  almond:{mix:[['almond',['#9C5B33','#8B4D2A','#AA6A3F','#94552F']]],s:.19},
  cashew:{mix:[['cashew',['#EEDCB5','#E5CFA1','#F3E4C3','#E9D5AC']]],s:.18},
  mix:{mix:[['peanut',['#C98A3E','#B9772F','#D9A055']],['chana',['#8B5A2B','#7A4C23','#9A6835']],['split',['#E4B648','#D8A83A']]],s:.13}
};
function hl(c,x,y,rx,ry){ c.beginPath(); c.fillStyle = 'rgba(255,255,255,.28)'; c.ellipse(x,y,rx,ry,-.3,0,Math.PI*2); c.fill(); }
function shape(c,kind,x,y,s,r,col){
  c.save(); c.translate(x,y); c.rotate(r);
  c.shadowColor = 'rgba(40,20,5,.32)'; c.shadowBlur = s*.16; c.shadowOffsetY = s*.06;
  c.fillStyle = col; c.strokeStyle = col; c.beginPath();
  if (kind === 'peanut') { c.ellipse(0,0,s*.5,s*.33,0,0,Math.PI*2); c.fill(); }
  else if (kind === 'chana' || kind === 'kabuli') { const k = kind === 'kabuli' ? .45 : .42; c.arc(0,0,s*k,0,Math.PI*2); c.moveTo(s*.28,-s*.3); c.lineTo(s*.56,-s*.43); c.lineTo(s*.41,-s*.1); c.closePath(); c.fill(); }
  else if (kind === 'split') { c.ellipse(0,0,s*.44,s*.38,0,0,Math.PI*2); c.fill(); }
  else if (kind === 'almond') { c.moveTo(s*.55,0); c.bezierCurveTo(s*.25,-s*.34,-s*.42,-s*.32,-s*.48,0); c.bezierCurveTo(-s*.42,s*.32,s*.25,s*.34,s*.55,0); c.fill(); }
  else if (kind === 'cashew') { c.lineCap = 'round'; c.lineWidth = s*.3; c.arc(0,0,s*.28,Math.PI*.05,Math.PI*1.05); c.stroke(); }
  c.shadowColor = 'transparent'; c.beginPath();
  const lw = Math.max(.6, s*.035);
  if (kind === 'peanut') { c.strokeStyle = 'rgba(60,25,5,.22)'; c.lineWidth = lw; c.moveTo(-s*.42,s*.02); c.quadraticCurveTo(0,s*.07,s*.42,s*.02); c.stroke(); hl(c,-s*.16,-s*.13,s*.18,s*.07); }
  else if (kind === 'chana' || kind === 'kabuli') { c.strokeStyle = 'rgba(40,15,5,.25)'; c.lineWidth = lw; c.arc(-s*.05,s*.04,s*.26,Math.PI*1.1,Math.PI*1.7); c.stroke(); if (kind === 'kabuli') { c.beginPath(); c.arc(s*.05,s*.08,s*.2,Math.PI*.2,Math.PI*.8); c.stroke(); } hl(c,-s*.14,-s*.17,s*.13,s*.07); }
  else if (kind === 'split') { c.strokeStyle = 'rgba(120,70,0,.3)'; c.lineWidth = Math.max(.6,s*.04); c.moveTo(-s*.36,0); c.lineTo(s*.36,0); c.stroke(); hl(c,-s*.12,-s*.18,s*.14,s*.06); }
  else if (kind === 'almond') { c.strokeStyle = 'rgba(50,20,5,.25)'; c.lineWidth = Math.max(.5,s*.025); for (let i=-1;i<=1;i++){ c.moveTo(-s*.38,i*s*.1); c.quadraticCurveTo(0,i*s*.16,s*.42,i*s*.04); } c.stroke(); }
  else if (kind === 'cashew') { c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = s*.07; c.arc(0,0,s*.33,Math.PI*.3,Math.PI*.8); c.stroke(); }
  c.restore();
}
function drawBowl(cv, kind, seed){
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h || !KIND[kind]) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  const k = KIND[kind], R = rng(seed);
  const rx = Math.min(w*.41, h*.6), cx = w/2, rimRy = rx*.25, depth = rx*.6, domeH = rx*.52;
  const rimY = h/2 + (domeH - depth)/2 + rx*.04;
  c.fillStyle = 'rgba(30,25,15,.13)'; c.beginPath(); c.ellipse(cx, rimY + depth + rx*.03, rx*.74, rx*.08, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#D6CAB6'; c.beginPath(); c.ellipse(cx, rimY, rx, rimRy, 0, 0, Math.PI*2); c.fill();
  const s = Math.max(5.5, rx*2*k.s);
  const n = Math.round(Math.PI*rx*(domeH + rimRy)/2/(s*s)*2.4);
  const pts = [];
  for (let i=0;i<n;i++){
    const m = k.mix[Math.floor(R()*k.mix.length)], x = R()*2 - 1, lim = Math.sqrt(1 - x*x);
    const top = -domeH*Math.pow(lim,.8), bot = rimRy*lim*.85;
    pts.push([m[0], cx + x*rx*.93, rimY + top + R()*(bot - top), s*(.85 + R()*.3), R()*Math.PI*2, m[1][Math.floor(R()*m[1].length)]]);
  }
  pts.sort((a,b) => a[2]-b[2]).forEach(p => shape(c, ...p));
  if (k.specks) { c.globalAlpha = .6; for (let i=0;i<n*2;i++){ const x = R()*2-1, lim = Math.sqrt(1-x*x); c.fillStyle = ['#7E1C10','#E07A2E','#5B1A0E'][i%3]; c.beginPath(); c.arc(cx + x*rx*.9, rimY - R()*domeH*lim, .5 + R()*1.1, 0, Math.PI*2); c.fill(); } c.globalAlpha = 1; }
  const g = c.createLinearGradient(0, rimY, 0, rimY + depth); g.addColorStop(0,'#FFFFFF'); g.addColorStop(1,'#E4DCCD');
  c.fillStyle = g; c.beginPath(); c.ellipse(cx, rimY, rx, depth, 0, 0, Math.PI, false); c.ellipse(cx, rimY, rx, rimRy, 0, Math.PI, 0, true); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = Math.max(1, rx*.025); c.beginPath(); c.ellipse(cx, rimY, rx, rimRy, 0, 0, Math.PI); c.stroke();
  c.strokeStyle = 'rgba(150,120,80,.25)'; c.lineWidth = Math.max(.8, rx*.012); c.beginPath(); c.ellipse(cx, rimY + depth*.55, rx*.62, rx*.08, 0, .15*Math.PI, .85*Math.PI); c.stroke();
}

/* ---- views ---- */
function listP(){
  const ql = query.trim().toLowerCase();
  const L = P.filter(p => (cat === 'all' || p.cat === cat) && (!ql || (p.name+' '+p.hi+' '+p.alt+' '+p.cat).toLowerCase().includes(ql)));
  const pk = p => perkg(p.v[0][0], p.v[0][1]);
  if (sortBy === 'low') L.sort((a,b) => pk(a) - pk(b));
  else if (sortBy === 'high') L.sort((a,b) => pk(b) - pk(a));
  else if (sortBy === 'protein') L.sort((a,b) => b.protein - a.protein);

function renderResults(){

  $('#bannerSlot').innerHTML = unfiltered ? `<section class="banner" aria-label="Offer"><div class="btext"><span class="bkick">Today's roast · ${today}</span><h2>Free delivery above ₹499</h2><p>Pay by UPI. Packed the same day.</p><a class="bbtn" href="#p-bcs">Shop roasted chana</a></div><div class="bimg"><canvas data-kind="chanaSkin" data-seed="banner" aria-hidden="true"></canvas></div></section>` : '';

/* ---- router ---- */
function current(){ return (location.hash || '#home').slice(1) || 'home'; }
function render(keepScroll){
  stopTimer();
  const r = current(), t = totals();
  let v;
  if (r.startsWith('p-')) v = V_product(r.slice(2));
  else if (r === 'saved') v = V_saved();
  else if (r === 'cart') v = V_cart(t);
  else if (r === 'checkout') v = t.count ? V_checkout(t) : V_cart(t);
  else if (r === 'pay') v = t.count ? V_pay(t) : V_cart(t);
  else if (r === 'done') v = V_done();
  else if (r === 'orders') v = V_orders();
  else v = V_home(t);
  $('#appbar').innerHTML = `<div class="wrap">${v.bar}</div>`;
  $('#view').innerHTML = v.body;
  $('#actionbar').hidden = !v.action; $('#actionIn').innerHTML = v.action || '';
  $('#tabbar').hidden = !v.nav;
  document.querySelectorAll('.tab').forEach(a => { if (a.dataset.tab === v.nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  document.body.classList.toggle('pad', !!(v.nav || v.pad));
  drawAll($('#appbar')); if (v.after) v.after(); drawAll($('#view'));
  updateDots();
  if (!keepScroll) window.scrollTo(0,0);
}
function go(h){ if (current() === h) render(); else location.hash = h; }
window.addEventListener('hashchange', () => render());

function updateDots(){
  const n = totals().count;
  document.querySelectorAll('[data-cartdot]').forEach(d => { d.textContent = n; d.hidden = !n; });
}
function change(id,w,d){
  const key = id+'|'+w, before = cart[key] || 0, q = before + d;
  if (q <= 0) delete cart[key]; else cart[key] = q;
  store('heena-cart', cart);
  const r = current();
  if (r === 'cart' || r.startsWith('p-')) render(true);
  else { document.querySelectorAll(`[data-row="${id}"]`).forEach(el => { el.innerHTML = rowHTML(id); }); updateDots(); }
  if (d > 0 && before === 0) toast(`Added ${byId(id).name}, ${wl(w)}`);
}

/* ---- payment ---- */
function upiLink(amount){ return `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(SHOP)}&am=${amount.toFixed(2)}&cu=INR&tn=${encodeURIComponent('Heena Store order')}`; }
function makeQR(amount){
  const box = $('#qr'); if (!box) return; box.innerHTML = ''; box.classList.remove('expired'); $('#qrExp').hidden = true;
  if (window.QRCode) new QRCode(box, {text: upiLink(amount), width:184, height:184, colorDark:'#0F1A14', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M});
  else box.innerHTML = `<p class="muted" style="text-align:center;padding:10px">QR could not load. Pay to the UPI ID instead.</p>`;
}
function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }
function tick(){ const el = $('#timer'); if (!el) return; const m = Math.floor(Math.max(0,left)/60), s = Math.max(0,left)%60; el.textContent = left > 0 ? `QR valid ${m}:${String(s).padStart(2,'0')}` : 'QR expired'; }
function startTimer(){
  stopTimer(); left = QR_SECONDS; tick();
  timerId = setInterval(() => { left--; tick(); if (left <= 0) { stopTimer(); const q = $('#qr'); if (q) q.classList.add('expired'); const e = $('#qrExp'); if (e) e.hidden = false; } }, 1000);
}
function placeOrder(utr){
  const t = totals(), now = new Date(), S = slots(), s = S[slot] || S[0];
  const ymd = String(now.getFullYear()).slice(2) + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
  orders.unshift({id:'HS' + ymd + '-' + String(Math.floor(1000 + Math.random()*9000)), utr, date: now.toISOString(), total:t.total, del:t.del,
    items: t.it.map(i => ({name:i.p.name, w:i.w, qty:i.qty, line:i.line})), slot: `${s.day}, ${s.time}`, addr});
  orders = orders.slice(0,20); store('heena-orders', orders);
  cart = {}; store('heena-cart', cart); go('done');
}
function confirmPay(utr){
  const b = $('#confirmBtn'), sim = $('#simBtn');
  if (b) { b.disabled = true; b.textContent = 'Checking payment…'; } if (sim) sim.disabled = true;
  setTimeout(() => placeOrder(utr), 1300);
}

/* ---- events ---- */
document.addEventListener('click', e => {
  const t = e.target;
  const a = t.closest('[data-act]'); if (a) { change(a.dataset.id, +a.dataset.w, a.dataset.act === 'dec' ? -1 : 1); return; }
  const f = t.closest('[data-fav]');
  if (f) { const id = f.dataset.fav; favs = isFav(id) ? favs.filter(x => x !== id) : favs.concat(id); store('heena-favs', favs);
    document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => b.setAttribute('aria-pressed', isFav(id)));
    toast(isFav(id) ? 'Saved' : 'Removed from saved'); if (current() === 'saved') render(true); return; }
  const c = t.closest('[data-cat]'); if (c) { cat = c.dataset.cat; $('#cats').innerHTML = catsHTML(); drawAll($('#cats')); renderResults(); return; }
  const so = t.closest('[data-sort]'); if (so) { sortBy = so.dataset.sort; $('#sorts').innerHTML = sortsHTML(); renderResults(); return; }
  if (t.closest('#sortBtn')) { sortOpen = !sortOpen; $('#sorts').hidden = !sortOpen; $('#sortBtn').setAttribute('aria-expanded', sortOpen); return; }
  const sz = t.closest('[data-size]'); if (sz) { sel[sz.dataset.id] = +sz.dataset.size; render(true); return; }
  const d = t.closest('[data-dq]'); if (d) { dq = Math.max(1, Math.min(20, dq + +d.dataset.dq)); render(true); return; }
  const aq = t.closest('[data-addq]');
  if (aq) { const id = aq.dataset.addq, w = sel[id], key = id+'|'+w; cart[key] = (cart[key] || 0) + dq; store('heena-cart', cart);
    toast(`Added ${dq} × ${wl(w)} to cart`); dq = 1; render(true); return; }
  const sl = t.closest('[data-slot]'); if (sl) { slot = +sl.dataset.slot; document.querySelectorAll('[data-slot]').forEach(b => b.setAttribute('aria-pressed', b === sl)); return; }
  if (t.closest('#copyVpa')) {
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#vpa')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('UPI ID selected. Copy it from the menu.'); };
    try { navigator.clipboard.writeText(UPI_ID).then(() => toast('UPI ID copied'), fallback); } catch (err) { fallback(); }
    return; }
  if (t.closest('#qrRefresh')) { makeQR(totals().total); startTimer(); return; }
  if (t.closest('#simBtn')) { let u = String(4 + Math.floor(Math.random()*5)); while (u.length < 12) u += Math.floor(Math.random()*10); $('#utr').value = u; $('#utrErr').textContent = ''; confirmPay(u); return; }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { query = e.target.value; renderResults(); } });
document.addEventListener('submit', e => {
  if (e.target.id === 'coForm') {
    e.preventDefault();
    const v = id => $('#'+id).value.trim();
    const f = {name:v('aName'), phone:v('aPhone'), line:v('aLine'), city:v('aCity'), pin:v('aPin')};
    const errs = {
      aName: f.name.length < 2 ? 'Enter the name for delivery.' : '',
      aPhone: /^[6-9]\d{9}$/.test(f.phone) ? '' : 'Enter a 10-digit mobile number starting with 6, 7, 8 or 9.',
      aLine: f.line.length < 6 ? 'Enter house number, street and area.' : '',
      aCity: f.city.length < 2 ? 'Enter your city.' : '',
      aPin: /^[1-9]\d{5}$/.test(f.pin) ? '' : 'Enter a 6-digit PIN code.'
    };
    let first = null;
    Object.keys(errs).forEach(k => { document.querySelector(`[data-for="${k}"]`).textContent = errs[k]; $('#'+k).setAttribute('aria-invalid', errs[k] ? 'true' : 'false'); if (errs[k] && !first) first = k; });
    if (first) { $('#'+first).focus(); return; }
    addr = f; store('heena-addr', addr); go('pay');
  }
  if (e.target.id === 'utrForm') {
    e.preventDefault();
    const u = $('#utr').value.replace(/\s/g,'');
    if (!/^\d{12}$/.test(u)) { $('#utrErr').textContent = 'The UTR is the 12-digit number in your UPI app after payment.'; $('#utr').setAttribute('aria-invalid','true'); $('#utr').focus(); return; }
    $('#utrErr').textContent = ''; confirmPay(u);
  }
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => drawAll(), 150); });
